<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Negotiation Assistant - Car Lease Project</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        .chat-container {
            max-width: 900px;
            margin: 0 auto;
            height: calc(100vh - 200px);
            display: flex;
            flex-direction: column;
        }

        .chat-header-bar {
            background: linear-gradient(135deg, var(--primary-color) 0%, var(--primary-light) 100%);
            color: white;
            padding: 1.5rem;
            border-radius: 1rem 1rem 0 0;
            box-shadow: var(--shadow-md);
        }

        .chat-header-bar h2 {
            color: white;
            margin: 0 0 0.5rem 0;
            font-size: 1.75rem;
        }

        .chat-description {
            opacity: 0.95;
            font-size: 0.95rem;
        }

        .chat-main {
            flex: 1;
            background: var(--card-bg);
            border-left: 2px solid var(--border-color);
            border-right: 2px solid var(--border-color);
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 1.5rem;
            background: var(--bg-color);
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .chat-messages::-webkit-scrollbar {
            width: 8px;
        }

        .chat-messages::-webkit-scrollbar-track {
            background: var(--bg-color);
        }

        .chat-messages::-webkit-scrollbar-thumb {
            background: var(--border-color);
            border-radius: 4px;
        }

        .chat-messages::-webkit-scrollbar-thumb:hover {
            background: var(--border-hover);
        }

        .message {
            max-width: 75%;
            padding: 1rem 1.25rem;
            border-radius: 1rem;
            line-height: 1.6;
            animation: messageSlide 0.3s ease;
        }

        @keyframes messageSlide {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .message.user {
            background: linear-gradient(135deg, var(--primary-color) 0%, var(--primary-light) 100%);
            color: white;
            margin-left: auto;
            border-bottom-right-radius: 0.25rem;
            box-shadow: var(--shadow-sm);
        }

        .message.assistant {
            background: white;
            color: var(--text-primary);
            margin-right: auto;
            border-bottom-left-radius: 0.25rem;
            border: 2px solid var(--border-color);
            box-shadow: var(--shadow-sm);
        }

        .message.typing {
            background: white;
            color: var(--text-muted);
            margin-right: auto;
            border: 2px solid var(--border-color);
        }

        .typing-indicator {
            display: flex;
            gap: 0.4rem;
            padding: 0.5rem 0;
        }

        .typing-dot {
            width: 8px;
            height: 8px;
            background: var(--text-muted);
            border-radius: 50%;
            animation: typingDot 1.4s infinite;
        }

        .typing-dot:nth-child(2) {
            animation-delay: 0.2s;
        }

        .typing-dot:nth-child(3) {
            animation-delay: 0.4s;
        }

        @keyframes typingDot {
            0%, 60%, 100% {
                transform: translateY(0);
            }
            30% {
                transform: translateY(-10px);
            }
        }

        .message-empty {
            text-align: center;
            color: var(--text-muted);
            padding: 3rem 1rem;
            font-size: 1rem;
        }

        .chat-input-area {
            background: var(--card-bg);
            padding: 1.5rem;
            border-radius: 0 0 1rem 1rem;
            border: 2px solid var(--border-color);
            border-top: none;
            box-shadow: var(--shadow-md);
        }

        .chat-input-wrapper {
            display: flex;
            gap: 1rem;
            align-items: flex-end;
        }

        .chat-input-wrapper textarea {
            flex: 1;
            padding: 1rem;
            border: 2px solid var(--border-color);
            border-radius: 0.75rem;
            resize: none;
            font-family: inherit;
            font-size: 1rem;
            color: var(--text-primary);
            background: var(--bg-color);
            transition: all 0.2s;
            min-height: 60px;
            max-height: 150px;
        }

        .chat-input-wrapper textarea:focus {
            outline: none;
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(5, 150, 105, 0.1);
        }

        .chat-actions {
            display: flex;
            gap: 0.75rem;
            flex-direction: column;
        }

        .chat-actions button {
            padding: 0.75rem 1.5rem;
            border-radius: 0.75rem;
            font-weight: 600;
            font-size: 0.95rem;
            cursor: pointer;
            transition: all 0.2s;
            border: none;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            white-space: nowrap;
        }

        .btn-send {
            background: linear-gradient(135deg, var(--primary-color) 0%, var(--primary-light) 100%);
            color: white;
        }

        .btn-send:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: var(--shadow-md);
        }

        .btn-send:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .btn-clear {
            background: transparent;
            color: var(--text-secondary);
            border: 2px solid var(--border-color);
        }

        .btn-clear:hover {
            background: var(--bg-secondary);
            border-color: var(--border-hover);
        }

        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            color: var(--primary-color);
            text-decoration: none;
            font-weight: 600;
            margin-bottom: 1.5rem;
            transition: all 0.2s;
        }

        .back-link:hover {
            transform: translateX(-5px);
        }

        @media (max-width: 768px) {
            .chat-container {
                height: calc(100vh - 150px);
            }

            .message {
                max-width: 85%;
            }

            .chat-actions {
                flex-direction: row;
            }

            .chat-input-wrapper {
                flex-direction: column;
                align-items: stretch;
            }

            .chat-actions button {
                flex: 1;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <a href="home.html" class="back-link">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <polyline points="15 18 9 12 15 6"></polyline>
                </svg>
                Back to Home
            </a>
            <h1>💬 Negotiation Assistant</h1>
            <p class="subtitle">AI-powered help for car lease contract negotiation</p>
        </header>

        <div class="status-bar">
            <div class="status-indicator" id="statusIndicator">
                <span class="status-dot"></span>
                <span id="statusText">Checking connection...</span>
            </div>
        </div>

        <div class="chat-container">
            <div class="chat-header-bar">
                <h2>Chat with AI Assistant</h2>
                <p class="chat-description">Ask questions about contract terms, negotiation strategies, and get personalized advice.</p>
            </div>
            
            <div class="chat-main">
                <div class="chat-messages" id="chatMessages">
                    <div class="message-empty">
                        <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" style="opacity: 0.3; margin: 0 auto 1rem;">
                            <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
                        </svg>
                        <p>Start a conversation with the negotiation assistant</p>
                    </div>
                </div>
            </div>

            <div class="chat-input-area">
                <div class="chat-input-wrapper">
                    <textarea 
                        id="chatInput" 
                        placeholder="Type your message here... (Press Enter to send, Shift+Enter for new line)"
                        rows="2"
                    ></textarea>
                    <div class="chat-actions">
                        <button id="btnSend" class="btn-send">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <line x1="22" y1="2" x2="11" y2="13"></line>
                                <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
                            </svg>
                            Send
                        </button>
                        <button id="btnClear" class="btn-clear">Clear</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="chat-page.js"></script>
</body>
</html>
